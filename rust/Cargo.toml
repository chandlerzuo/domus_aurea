[package]
name = "guandan_core"
version = "0.1.0"
edition = "2021"
description = "Rust core for the guandan project: rules engine, move generation, RL feature encoding"

[lib]
name = "guandan_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
