<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>掼蛋</title>
<style>
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; margin: 0; background: #0f3d2e; color: #eee; }
  header { display: flex; gap: 12px; align-items: center; padding: 8px 16px; background: #0a2a20; flex-wrap: wrap; }
  header .grow { flex: 1; }
  a { color: #e8c547; cursor: pointer; }
  button { background: #e8c547; border: 0; padding: 6px 14px; border-radius: 4px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button.secondary { background: #cfd8d3; }
  select, input[type=text] { padding: 5px; border-radius: 4px; border: 1px solid #888; }
  .error { color: #ff8a80; min-height: 1.2em; }
  .meta { font-size: 12px; opacity: .8; }
  .hidden { display: none !important; }
  .banner { background: #e8c547; color: #111; padding: 6px 12px; border-radius: 6px; font-weight: 600; }
  /* lobby */
  #lobby { max-width: 900px; margin: 24px auto; padding: 0 12px; }
  .tables { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .tcard { background: #0a2a20; border-radius: 8px; padding: 16px; }
  .tcard h2 { margin: 0 0 8px; }
  .seatline { font-size: 13px; margin: 2px 0; }
  .tcard .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
  table.list { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  table.list td, table.list th { padding: 4px 6px; border-bottom: 1px solid #1e5a45; text-align: left; }
  /* table */
  #main { display: grid; grid-template-columns: 1fr 300px; gap: 12px; padding: 12px; }
  #felt, #rfelt { display: grid; grid-template-columns: 210px 1fr 210px; grid-template-rows: auto 1fr auto; gap: 8px; min-height: 520px; }
  .seat { background: rgba(0,0,0,.2); border-radius: 8px; padding: 8px; min-height: 90px; }
  .seat.to_act { outline: 3px solid #e8c547; }
  .seat .name { font-weight: 600; }
  .pos-top { grid-column: 2; grid-row: 1; }
  .pos-left { grid-column: 1; grid-row: 2; }
  .pos-right { grid-column: 3; grid-row: 2; }
  .pos-bottom { grid-column: 1 / 4; grid-row: 3; }
  .center { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
  .cards { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; }
  .card { width: 34px; height: 50px; background: #fff; color: #111; border-radius: 4px; border: 1px solid #555;
          display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 15px;
          font-weight: 700; user-select: none; position: relative; }
  .card.red { color: #c62828; }
  .card.joker { font-size: 12px; writing-mode: vertical-rl; letter-spacing: 2px; }
  .card.wild::after { content: "配"; position: absolute; top: 1px; right: 2px; font-size: 9px; color: #6a1b9a; }
  .hand.mine .card { cursor: pointer; transition: transform .08s; }
  .hand .card.sel { transform: translateY(-10px); box-shadow: 0 4px 0 #e8c547; }
  .mini .card { width: 24px; height: 36px; font-size: 11px; }
  /* My hand: cards of one rank are stacked vertically, ranks side by side. Cards can be dragged to rearrange. */
  .cards.hand { flex-wrap: nowrap; align-items: flex-start; gap: 0; overflow-x: auto; padding: 14px 4px 8px; min-height: 90px; }
  .hand .hcol { display: flex; flex-direction: column; flex: none; padding: 0 3px; }
  .hand .hcol .card + .card { margin-top: -48px; }
  .hand .card { width: 46px; height: 68px; font-size: 16px; flex-direction: row; justify-content: center; align-items: flex-start; padding-top: 3px; box-sizing: border-box; flex: none; }
  .hand .card br { display: none; }
  .hand .card.joker { padding-top: 6px; }
  /* Selected cards leave their column and wait in the tray above the hand, so the rest of the column stays easy to click. */
  .picked { display: flex; align-items: center; gap: 10px; min-height: 84px; padding: 4px 8px; margin-top: 6px; border: 1px dashed rgba(232,197,71,.55); border-radius: 8px; background: rgba(232,197,71,.07); }
  .picked.hidden { display: none; }
  .picked .label { font-size: 13px; color: #e8c547; white-space: nowrap; }
  .picked .cards { margin: 0; gap: 4px; flex-wrap: wrap; }
  .picked .card { width: 46px; height: 68px; font-size: 16px; flex-direction: row; justify-content: center; align-items: flex-start; padding-top: 3px; box-sizing: border-box; cursor: pointer; box-shadow: 0 3px 0 #e8c547; }
  .picked .card br { display: none; }
  .hand.mine .card[draggable="true"] { cursor: grab; }
  .hand.organizing { outline: 2px dashed #e8c547; outline-offset: 2px; border-radius: 8px; }
  .organize-hint { font-size: 13px; color: #e8c547; }
  .hand .card.dragging { opacity: .35; }
  .hand .gap { flex: none; width: 6px; align-self: stretch; border-radius: 6px; transition: width .1s; }
  .hand.dragging .gap { width: 26px; outline: 1px dashed rgba(255,255,255,.35); }
  .hand.dragging .gap.over, .hand .hcol.over { background: rgba(232,197,71,.25); outline: 1px solid #e8c547; }
  .controls { display: flex; gap: 8px; margin-top: 10px; align-items: center; flex-wrap: wrap; }
  #log, #moves { background: rgba(0,0,0,.25); border-radius: 8px; padding: 8px; font: 12px/1.4 ui-monospace, monospace;
         height: 560px; overflow-y: auto; white-space: pre-wrap; }
  #sugg button { display: block; margin: 4px 0; text-align: left; background: #cfe8dc; font-weight: 500; }
  #moves div { cursor: pointer; padding: 1px 4px; border-radius: 3px; }
  #moves div.cur { background: #e8c547; color: #111; }
  #moves div.flag { border-left: 3px solid #ff8a80; }
  #review { background: rgba(0,0,0,.25); border-radius: 8px; padding: 8px; margin-top: 8px; font-size: 13px; }
  #review .item { padding: 6px; margin: 4px 0; background: rgba(0,0,0,.25); border-radius: 4px; cursor: pointer; }
  @media (max-width: 800px) { .tables { grid-template-columns: 1fr; } #main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <a href="../" title="返回游戏大厅" style="opacity:.7">‹ 大厅</a>
  <strong><a id="home">掼蛋</a></strong>
  <span id="where"></span>
  <span class="grow"></span>
  <span class="error" id="err"></span>
</header>

<div id="lobby">
  <p class="meta">在空桌入座即成为桌主：可以用 AI 补满空位，也可以等朋友入座，然后开始对局。座位先到先得。
    也可以观战任意一桌，从某一位玩家的视角看牌——只能看到这位玩家的手牌。</p>
  <div class="tables" id="tables"></div>
  <h3>最近的牌局</h3>
  <table class="list"><thead><tr><th>牌局</th><th>桌号</th><th>南北方得分</th><th>真人玩家</th><th>使用 AI 提示</th><th></th></tr></thead>
    <tbody id="recent"></tbody></table>
</div>

<div id="game" class="hidden">
  <div id="main">
    <div>
      <div id="felt">
        <div class="seat pos-top" id="pos-top"></div>
        <div class="seat pos-left" id="pos-left"></div>
        <div class="center" id="center"></div>
        <div class="seat pos-right" id="pos-right"></div>
        <div class="seat pos-bottom" id="pos-bottom">
          <div id="mine"></div>
          <div class="picked hidden" id="picked"><span class="label">已选 <b id="pickedN">0</b></span><div class="cards" id="pickedCards"></div></div>
          <div class="cards hand" id="hand"></div>
          <div class="controls hidden" id="hostControls">
            <button id="startBtn">开始对局</button>
            <span class="meta" id="hostHint"></span>
          </div>
          <div class="controls" id="playerControls">
            <button id="playBtn">出牌</button>
            <button id="passBtn" class="secondary">不出</button>
            <button id="clearBtn" class="secondary">重选</button>
            <button id="sortBtn" class="secondary" title="进入整理模式：拖动手牌调整位置；完成后再选牌出牌">整理手牌</button>
            <button id="autoSortBtn" class="secondary hidden" title="按点数把牌重新叠放">自动排序</button>
            <span id="organizeHint" class="organize-hint hidden">整理中：拖动牌来调整位置，完成后点“完成整理”再选牌</span>
            <button id="nextBtn" class="hidden">下一局</button>
            <button id="leaveBtn" class="secondary">离开座位</button>
          </div>
          <div class="controls hidden" id="watchControls">
            观战视角 <select id="watchSeat"></select>
            <button id="backBtn" class="secondary">返回大厅</button>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div id="sugg" class="hidden"><strong>AI 提示</strong><div id="suggList"></div></div>
      <div id="deals" class="meta"></div>
      <div id="log"></div>
    </div>
  </div>
</div>

<div id="replay" class="hidden">
  <div id="main" style="display:grid">
    <div>
      <div id="rfelt">
        <div class="seat pos-top" id="r2"></div>
        <div class="seat pos-left" id="r3"></div>
        <div class="center" id="rcenter"></div>
        <div class="seat pos-right" id="r1"></div>
        <div class="seat pos-bottom" id="r0"></div>
      </div>
      <div class="controls">
        <button id="rFirst" class="secondary">⏮</button>
        <button id="rPrev" class="secondary">◀</button>
        <input type="range" id="rSlider" min="0" value="0" style="flex:1">
        <button id="rNext" class="secondary">▶</button>
        <button id="rLast" class="secondary">⏭</button>
        <span id="rStep" class="meta"></span>
      </div>
      <div id="review"></div>
    </div>
    <div id="moves"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const SUIT = { s: "♠", h: "♥", c: "♣", d: "♦" };
const RANKS = "23456789TJQKA", SUITS = "shcd";
const NAMES = ["南", "东", "北", "西"];
const PLACES = ["头游", "二游", "三游", "末游"];
const AGENT_NAMES = { "ppo+": "PPO+搜索", ppo: "PPO", dmc: "DMC", heuristic: "规则", random: "随机" };
const agentName = a => AGENT_NAMES[a] || a;
const agentOption = a => a === "ppo+" ? "PPO+搜索（推荐，最强）" : agentName(a);
const playedText = m => m === "不出" ? "选择了不出" : `出了 ${m}`;
const POS = ["pos-bottom", "pos-right", "pos-top", "pos-left"];  // by seat relative to the viewer
let route = { view: "lobby" }, state = null, selected = new Set(), poll = null, lobbyData = null;

const token = t => sessionStorage.getItem("seat-" + t);

async function api(path, body, tableId) {
  const headers = {};
  if (tableId && token(tableId)) headers["X-Seat-Token"] = token(tableId);
  const opts = body === undefined ? { method: "GET", headers }
    : { method: "POST", headers: { ...headers, "Content-Type": "application/json" }, body: JSON.stringify(body) };
  const r = await fetch(path, opts);
  const data = await r.json();
  if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { status: r.status });
  return data;
}

function text(tag, t, cls) { const e = document.createElement(tag); e.textContent = t; if (cls) e.className = cls; return e; }
function option(value, label) { const o = document.createElement("option"); o.value = value; o.textContent = label; return o; }
const rankName = r => r === "T" ? "10" : r;
const teamName = t => t === 0 ? "南北方" : "东西方";
const SUIT_TEXT = { s: "♠", h: "♥", c: "♣", d: "♦" };
const cardText = l => l === "sj" ? "小王" : l === "BJ" ? "大王" : SUIT_TEXT[l[1]] + rankName(l[0]);

// ---- my hand: same-rank cards stacked in a column, columns side by side; drag cards to rearrange ----
let organizing = false;                      // "organize cards" mode: cards can be dragged, but not selected
let handLayout = { deal: null, cols: [] };   // cols: arrays of card ids, left to right
let dragIds = null;                          // ids being dragged (null when not dragging)
const groupKey = c => (c.label === "sj" || c.label === "BJ") ? c.label : c.label[0];

function reconcileHand(hand, deal) {
  if (handLayout.deal !== deal) handLayout = { deal, cols: [] };
  const byId = new Map(hand.map((c, i) => [c.id, { c, i }]));
  handLayout.cols = handLayout.cols.map(col => col.filter(id => byId.has(id))).filter(col => col.length);
  const placed = new Set(handLayout.cols.flat());
  for (const { c, i } of hand.map(c => byId.get(c.id))) {
    if (placed.has(c.id)) continue;
    const col = handLayout.cols.find(col => groupKey(byId.get(col[0]).c) === groupKey(c));
    if (col) col.push(c.id);
    else {
      const at = handLayout.cols.findIndex(col => byId.get(col[0]).i > i);
      handLayout.cols.splice(at < 0 ? handLayout.cols.length : at, 0, [c.id]);
    }
  }
}

function moveCards(moving, targetCol, beforeId) {
  // targetCol: existing column (array) to insert into, or null for a new column at index newAt
  const mv = new Set(moving);
  return (newAt) => {
    const cols = handLayout.cols;
    const anchor = targetCol ? null : cols[newAt] || null;   // column that a new column goes before
    for (const col of cols) for (let i = col.length - 1; i >= 0; i--) if (mv.has(col[i])) col.splice(i, 1);
    if (targetCol) {
      const at = beforeId == null ? targetCol.length : targetCol.indexOf(beforeId);
      targetCol.splice(at < 0 ? targetCol.length : at, 0, ...moving);
    } else {
      const at = anchor ? cols.indexOf(anchor) : cols.length;
      cols.splice(at, 0, [...moving]);
    }
    handLayout.cols = cols.filter(col => col.length);
  };
}

function renderHand(s) {
  if (dragIds) return;   // a drag is in progress: don't rebuild the DOM under it
  const hand = $("hand");
  hand.replaceChildren();
  hand.classList.remove("dragging");
  hand.classList.toggle("mine", s.as_player);
  hand.classList.toggle("organizing", s.as_player && organizing);
  reconcileHand(s.hand, s.deal_no);
  const cardById = new Map(s.hand.map(c => [c.id, c]));
  const order = new Map(s.hand.map((c, i) => [c.id, i]));   // the server sends the hand sorted ascending
  handLayout.cols.forEach(col => col.sort((a, b) => order.get(a) - order.get(b)));   // a column is always in ascending order
  const mine = s.as_player;
  const startDrag = (e, id) => {
    dragIds = [id];
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", String(id));
    setTimeout(() => { hand.classList.add("dragging"); hand.querySelectorAll(".card").forEach(el => { if (dragIds && dragIds.includes(+el.dataset.id)) el.classList.add("dragging"); }); }, 0);
  };
  const endDrag = () => { dragIds = null; render(); };
  const allowDrop = (el, onDrop) => {
    el.addEventListener("dragover", e => { if (!dragIds) return; e.preventDefault(); e.dataTransfer.dropEffect = "move"; el.classList.add("over"); });
    el.addEventListener("dragleave", () => el.classList.remove("over"));
    el.addEventListener("drop", e => { if (!dragIds) return; e.preventDefault(); e.stopPropagation(); onDrop(e); });
  };
  const gap = at => {
    const g = document.createElement("div");
    g.className = "gap";
    if (mine && organizing) allowDrop(g, () => { const m = dragIds; moveCards(m, null)(at); endDrag(); });
    return g;
  };
  handLayout.cols.forEach((col, ci) => {
    const shown = col.filter(id => !selected.has(id));   // selected cards are in the tray
    if (!shown.length) return;
    hand.append(gap(ci));
    const colEl = document.createElement("div");
    colEl.className = "hcol";
    for (const id of shown) {
      const card = cardById.get(id);
      const el = cardEl(card.label, card.wild);
      el.dataset.id = id;
      if (mine && organizing) {
        el.draggable = true;
        el.addEventListener("dragstart", e => startDrag(e, id));
        el.addEventListener("dragend", endDrag);
      } else if (mine) {
        el.onclick = () => { selected.has(id) ? selected.delete(id) : selected.add(id); render(); };
      }
      colEl.append(el);
    }
    if (mine && organizing) allowDrop(colEl, e => {
      // insert before the first card whose middle is below the pointer; otherwise at the bottom
      const m = dragIds, rest = shown.filter(x => !m.includes(x));
      const before = rest.find(x => { const r = colEl.querySelector(`[data-id="${x}"]`).getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
      moveCards(m, col, before)(0);
      endDrag();
    });
    hand.append(colEl);
  });
  hand.append(gap(handLayout.cols.length));

  // the tray of selected cards (click one to put it back in its column)
  const picked = [...selected].filter(id => cardById.has(id)).sort((a, b) => order.get(a) - order.get(b));
  $("picked").classList.toggle("hidden", !mine || !picked.length);
  $("pickedN").textContent = picked.length;
  $("pickedCards").replaceChildren(...picked.map(id => {
    const card = cardById.get(id);
    const el = cardEl(card.label, card.wild);
    el.dataset.id = id;
    el.title = "点击放回手牌";
    el.onclick = () => { selected.delete(id); render(); };
    return el;
  }));
}

function cardEl(label, wild) {
  const el = document.createElement("div");
  el.className = "card";
  if (label === "sj" || label === "BJ") {
    el.classList.add("joker");
    if (label === "BJ") el.classList.add("red");
    el.textContent = label === "BJ" ? "大王" : "小王";
  } else {
    const suit = label[1];
    if (suit === "h" || suit === "d") el.classList.add("red");
    el.append(document.createTextNode(rankName(label[0])), document.createElement("br"), document.createTextNode(SUIT[suit]));
  }
  if (wild) el.classList.add("wild");
  return el;
}

// level: the rank character being played (e.g. "2"); the heart of that rank is the wild card, so mark it ("配")
// in played cards too -- otherwise 6 6 6 + the wild 2♥ looks like an invalid bomb.
function cardsRow(labels, cls = "cards mini", level = null) {
  const row = document.createElement("div");
  row.className = cls;
  for (const l of labels) row.append(cardEl(l, level !== null && l === level + "h"));
  return row;
}

function show(view) {
  for (const v of ["lobby", "game", "replay"]) $(v).classList.toggle("hidden", v !== view);
  clearInterval(poll);
  poll = null;
}

function setError(msg) { $("err").textContent = msg || ""; }

function seatLabel(info, i) {
  if (info.kind === "empty") return `${NAMES[i]}：空位`;
  if (info.kind === "human") return `${NAMES[i]}：${info.name}`;
  return `${NAMES[i]}：AI（${agentName(info.kind)}）`;
}

// ---- lobby -----------------------------------------------------------------

async function openLobby() {
  route = { view: "lobby" };
  show("lobby");
  $("where").textContent = "大厅";
  const refresh = async () => {
    try { lobbyData = await api("api/lobby"); renderLobby(); } catch (e) { setError(e.message); }
  };
  await refresh();
  poll = setInterval(refresh, 3000);
}

function renderLobby() {
  const box = $("tables");
  if (box.contains(document.activeElement)) return;  // don't wipe a form the user is filling in
  box.replaceChildren();
  for (const t of lobbyData.tables) {
    const c = document.createElement("div");
    c.className = "tcard";
    const status = { open: "空桌", waiting: `等待开局（桌主：${t.host === null ? "-" : t.seats[t.host].name}）`,
                     playing: `对局中——第 ${t.deal_no} 局，级数 南北 ${t.team_levels ? rankName(t.team_levels[0]) : ""} / 东西 ${t.team_levels ? rankName(t.team_levels[1]) : ""}` }[t.status];
    c.append(text("h2", `${t.id} 号桌`), text("div", status, "meta"));
    t.seats.forEach((x, i) => c.append(text("div", seatLabel(x, i), "seatline")));
    const row = document.createElement("div");
    row.className = "row";
    if (token(t.id) && t.status !== "open") {
      const b = text("button", "回到我的座位");
      b.onclick = () => { location.hash = `table-${t.id}`; };
      row.append(b);
    } else if (t.status !== "playing") {
      const empty = t.seats.map((x, i) => x.kind === "empty" ? i : -1).filter(i => i >= 0);
      const sel = document.createElement("select");
      empty.forEach(i => sel.append(option(i, NAMES[i] + "家")));
      const name = document.createElement("input");
      name.type = "text"; name.placeholder = "你的名字"; name.maxLength = 16; name.size = 10;
      name.value = localStorage.getItem("name") || "";
      const lab = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      lab.append(cb, document.createTextNode(" AI 提示"));
      const b = text("button", t.status === "open" ? "入座并当桌主" : "入座");
      b.onclick = () => sit(t.id, +sel.value, name.value, cb.checked);
      if (empty.length) row.append(sel, name, lab, b);
    }
    if (t.status !== "open") {
      const wsel = document.createElement("select");
      NAMES.forEach((n, i) => wsel.append(option(i, n + "家视角")));
      const w = text("button", "观战", "secondary");
      w.onclick = () => { location.hash = `watch-${t.id}-${wsel.value}`; };
      row.append(wsel, w);
    }
    c.append(row);
    box.append(c);
  }
  const tb = $("recent");
  tb.replaceChildren();
  for (const d of lobbyData.recent) {
    const tr = document.createElement("tr");
    tr.append(text("td", `#${d.id}（第 ${d.deal_no} 局）`), text("td", `${d.table} 号桌`), text("td", d.result > 0 ? `+${d.result}` : `${d.result}`),
              text("td", d.humans.map(s => NAMES[s] + "家").join("、") || "无"), text("td", d.assisted.map(s => NAMES[s] + "家").join("、") || "无"));
    const td = document.createElement("td");
    const a = text("a", "回放与复盘");
    a.onclick = () => { location.hash = `replay-${d.id}`; };
    td.append(a);
    tr.append(td);
    tb.append(tr);
  }
}

async function sit(tid, seat, name, suggestions) {
  setError("");
  localStorage.setItem("name", name);
  try {
    const r = await api(`api/table/${tid}/sit`, { seat, name, suggestions });
    sessionStorage.setItem("seat-" + tid, r.token);
    location.hash = `table-${tid}`;
  } catch (e) { setError(e.message); }
}

// ---- table (waiting room, play, watch) --------------------------------------

function openTable(tid, watchSeat) {
  route = { view: "game", table: tid, seat: watchSeat };
  show("game");
  selected.clear();
  $("watchSeat").replaceChildren(...NAMES.map((n, i) => option(i, n + "家")));
  $("watchSeat").value = watchSeat;
  refreshTable();
  poll = setInterval(refreshTable, 700);
}

async function refreshTable() {
  const { table, seat } = route;
  try {
    const s = await api(`api/table/${table}/state?seat=${seat}`, undefined, table);
    if (token(table) && s.my_seat === null) {
      sessionStorage.removeItem("seat-" + table);
      setError("你的座位已被释放（离开、长时间无响应或超时）。");
    }
    if (s.status === "open") { if (location.hash) location.hash = ""; return openLobby(); }
    state = s;
    render();
  } catch (e) { setError(e.message); }
}

const seated = () => state.my_seat !== null && state.my_seat !== undefined;

function render() {
  const s = state;
  $("where").textContent = `${s.table} 号桌——` + (seated() ? `你坐${NAMES[s.my_seat]}家` + (s.host === s.my_seat ? "（桌主）" : "") : "观战中");
  $("playerControls").classList.toggle("hidden", !seated());
  $("watchControls").classList.toggle("hidden", seated());
  $("hostControls").classList.toggle("hidden", !(seated() && s.status === "waiting" && s.host === s.my_seat));
  if (s.status === "waiting") return renderWaiting();
  renderPlaying();
}

function renderWaiting() {
  const s = state, v = seated() ? s.my_seat : route.seat, isHost = seated() && s.host === s.my_seat;
  for (let seat = 0; seat < 4; seat++) {
    const rel = (seat - v + 4) % 4;
    const el = rel === 0 ? $("mine") : $(POS[rel]);
    el.replaceChildren();
    if (rel !== 0) el.classList.remove("to_act");
    const info = s.seats_info[seat];
    el.append(text("div", seatLabel(info, seat) + (seat === s.host ? " · 桌主" : "") + (seat % 2 === v % 2 && seat !== v ? "（对家）" : ""), "name"));
    if (isHost && info.kind !== "human") {
      const row = document.createElement("div");
      row.className = "controls";
      if (info.kind === "empty") {
        const b = text("button", "加入 AI", "secondary");
        b.onclick = () => act("seat", { seat, kind: lobbyAgents()[0] });
        row.append(b);
      } else {
        const b = text("button", "移除 AI", "secondary");
        b.onclick = () => act("seat", { seat, kind: "empty" });
        row.append(b);
      }
      el.append(row);
    } else if (info.kind === "empty") {
      el.append(text("div", "等待玩家入座…", "meta"));
    }
  }
  $("hand").replaceChildren();
  const full = s.seats_info.every(x => x.kind !== "empty");
  $("startBtn").disabled = !full;
  $("hostHint").textContent = full ? "座位已满。" : "用 AI 补满空位，或等待其他玩家入座。";
  $("center").replaceChildren(text("div", isHost ? "你是桌主。座位坐满后即可开始。"
    : `等待桌主（${s.seats_info[s.host].name}）开始…`, "banner"));
  for (const id of ["playBtn", "passBtn", "clearBtn"]) $(id).disabled = true;
  $("nextBtn").classList.add("hidden");
  $("sugg").classList.add("hidden");
  $("log").textContent = "";
}

function lobbyAgents() { return (lobbyData && lobbyData.agents) || ["heuristic", "random"]; }

function renderSeat(p, el) {
  const s = state;
  el.replaceChildren();
  el.classList.toggle("to_act", p.to_act);
  el.append(text("div", p.name + (p.seat % 2 === s.view_seat % 2 ? "（对家）" : ""), "name"));
  el.append(text("div", `${NAMES[p.seat]}家 · 剩 ${p.cards_left} 张` + (p.place ? ` · ${PLACES[p.place - 1]}` : ""), "meta"));
  if (p.last) {
    el.append(text("div", p.last.kind, "meta"));
    if (p.last.cards.length) el.append(cardsRow(p.last.cards, "cards mini", s.level));
  }
  if (s.revealed && s.revealed[p.seat]) el.append(text("div", "剩余手牌：", "meta"), cardsRow(s.revealed[p.seat], "cards mini", s.level));
}

function renderPlaying() {
  const s = state, v = s.view_seat;
  for (const p of s.seats) {
    const rel = (p.seat - v + 4) % 4;
    if (rel !== 0) renderSeat(p, $(POS[rel]));
  }
  const me = s.seats[v];
  $("pos-bottom").classList.toggle("to_act", me.to_act);
  const mine = $("mine");
  mine.replaceChildren(text("span", `${me.name}${s.as_player ? "（你）" : "（观战视角）"} · ${NAMES[v]}家`, "name"),
                       text("span", `  剩 ${me.cards_left} 张` + (me.place ? ` · ${PLACES[me.place - 1]}` : ""), "meta"));
  if (me.last) {
    mine.append(text("div", "出牌：" + me.last.kind, "meta"));
    if (me.last.cards.length) mine.append(cardsRow(me.last.cards, "cards mini", s.level));
  }

  const myTurn = s.as_player && s.phase === "human_turn" && s.waiting_on.includes(v);
  const myReturn = s.as_player && s.phase === "return" && s.waiting_on.includes(v);
  const c = $("center");
  c.replaceChildren();
  c.append(text("div", `第 ${s.deal_no} 局 · 打 ${rankName(s.level)}`, "banner"));
  c.append(text("div", `级数——南北方：${rankName(s.team_levels[0])}  ·  东西方：${rankName(s.team_levels[1])}`));
  c.append(text("div", `红桃 ${rankName(s.level)} 是逢人配（标“配”），可以当任意非王牌使用。`, "meta"));
  for (const t of s.tributes) {
    c.append(text("div", `${s.seats[t.payer].name} 进贡 ${t.card} 给 ${s.seats[t.receiver].name}` + (t.returned ? `，还贡 ${t.returned}` : ""), "meta"));
  }
  if (s.resisted) c.append(text("div", "抗贡（两张大王都在进贡方手里）。", "meta"));
  const turn = s.seats.find(x => x.to_act);
  let msg = {
    human_turn: myTurn ? (s.leading ? "轮到你首出——任意牌型都可以。" : "轮到你——压过桌上的牌，或者不出。") : `${turn ? turn.name : ""} 思考中…`,
    ai_turn: `${turn ? turn.name : "AI"} 思考中…`,
    return: myReturn ? "请还贡：选一张 10 或以下的牌还给进贡的玩家。" : "等待还贡…",
    deal_over: s.result ? `本局结束：${teamName(s.result.win_team)}升 ${s.result.up} 级。名次：${s.result.order.map((n, i) => PLACES[i] + " " + n).join("，")}。${s.next_in} 秒后开始下一局` : "",
    match_over: `整场比赛结束——${teamName(s.match_winner)}获胜！`,
  }[s.phase];
  c.append(text("div", msg, "banner"));

  const ids = new Set(s.hand.map(x => x.id));
  selected = new Set([...selected].filter(id => ids.has(id)));
  renderHand(s);
  if (!s.as_player) organizing = false;
  $("sortBtn").textContent = organizing ? "完成整理" : "整理手牌";
  $("sortBtn").disabled = !s.as_player;
  $("autoSortBtn").classList.toggle("hidden", !organizing);
  $("organizeHint").classList.toggle("hidden", !organizing);
  if (s.as_player) {
    $("playBtn").textContent = myReturn ? "还贡" : "出牌";
    $("playBtn").disabled = !(myTurn || myReturn) || selected.size === 0;
    $("passBtn").disabled = !myTurn || s.leading;
    $("clearBtn").disabled = false;
    $("nextBtn").classList.toggle("hidden", s.phase !== "deal_over");
  }
  const sugg = $("sugg");
  sugg.classList.toggle("hidden", !(s.suggestions && s.suggestions.length));
  if (s.suggestions) {
    $("suggList").replaceChildren(...s.suggestions.map(x => {
      const b = text("button", `${x.p === null ? "" : Math.round(x.p * 100) + "% · "}${x.move}`);
      b.onclick = () => { selected = new Set(x.cards); render(); };
      return b;
    }));
  }
  const deals = $("deals");
  deals.replaceChildren();
  if (s.deal_ids.length) {
    deals.append("本场已完成的牌局（新标签页打开回放）：");
    s.deal_ids.forEach((id, i) => { const a = text("a", `#${i + 1}`); a.onclick = () => window.open(`#replay-${id}`, "_blank"); deals.append(a, " "); });
  }
  $("log").textContent = s.log.join("\n");
  $("log").scrollTop = 1e9;
}

async function act(cmd, body) {
  setError("");
  try { state = await api(`api/table/${route.table}/${cmd}`, body, route.table); if (state.status === "open") return openLobby(); render(); }
  catch (e) {
    if (e.status === 409 && !token(route.table)) return openLobby();
    setError(e.message);
  }
}

$("playBtn").onclick = () => {
  if (state.phase === "return") {
    if (selected.size !== 1) return setError("请只选一张牌");
    act("return", { card: [...selected][0] });
  } else act("play", { cards: [...selected] });
  selected.clear();
};
$("passBtn").onclick = () => { selected.clear(); act("play", { cards: [] }); };
$("sortBtn").onclick = () => { organizing = !organizing; render(); };
$("autoSortBtn").onclick = () => { handLayout = { deal: null, cols: [] }; render(); };
$("clearBtn").onclick = () => { selected.clear(); render(); };
$("nextBtn").onclick = () => act("next", {});
$("startBtn").onclick = () => act("start", {});
$("leaveBtn").onclick = async () => {
  try { await api(`api/table/${route.table}/leave`, {}, route.table); } catch (e) { /* already released */ }
  sessionStorage.removeItem("seat-" + route.table);
  location.hash = "";
};
$("watchSeat").onchange = () => { route.seat = +$("watchSeat").value; history.replaceState(null, "", `#watch-${route.table}-${route.seat}`); refreshTable(); };
$("backBtn").onclick = () => { location.hash = ""; };
$("home").onclick = () => { location.hash = ""; openLobby(); };

// ---- replay & review -------------------------------------------------------

let rec = null, rstep = 0, review = null, reviewSeat = 0;

const typeLabel = t => t === 52 ? "sj" : t === 53 ? "BJ" : RANKS[t % 13] + SUITS[Math.floor(t / 13)];
const cardLabel = id => typeLabel(id % 54);
function sortKey(id, level) { const t = id % 54; const v = t === 52 ? 14 : t === 53 ? 15 : (t % 13 === level ? 13 : t % 13); return v * 100 + t; }

async function openReplay(id) {
  route = { view: "replay", deal: id };
  show("replay");
  setError("");
  try { rec = await api(`api/deal/${id}`); } catch (e) { setError(e.message); return; }
  review = null;
  rstep = 0;
  reviewSeat = rec.humans.length ? rec.humans[0] : 0;
  $("where").textContent = `回放——牌局 #${id}（${rec.table} 号桌，本场第 ${rec.deal_no} 局）`;
  $("rSlider").max = rec.moves.length;
  renderReplay();
  loadReview(false);
}

function handsAt(k) {
  const hands = rec.hands.map(h => [...h]);
  for (let i = 0; i < k; i++) {
    const [seat, cards] = rec.moves[i];
    hands[seat] = hands[seat].filter(c => !cards.includes(c));
  }
  return hands;
}

function moveText(m) { const [seat, cards, kind] = m; return kind === 0 ? `${rec.names[seat]}：不出` : `${rec.names[seat]}：${cards.map(c => cardText(cardLabel(c))).join(" ")}`; }

function renderReplay() {
  const k = rstep, hands = handsAt(k);
  let lead = 0;
  for (let i = 0; i < k; i++) if (rec.leads[i]) lead = i;
  const trick = {};
  if (k > 0) for (let i = lead; i < k; i++) trick[rec.moves[i][0]] = rec.moves[i];
  const decision = review && review.decisions.find(d => d.step === k);
  for (let s = 0; s < 4; s++) {
    const el = $("r" + s);
    el.replaceChildren();
    el.classList.toggle("to_act", k < rec.moves.length && rec.moves[k][0] === s);
    const out = hands[s].length === 0 && rec.finished.includes(s) ? ` · ${PLACES[rec.finished.indexOf(s)]}` : "";
    el.append(text("div", `${rec.names[s]}` + (rec.humans.includes(s) ? ` · ${NAMES[s]}家` : "") + out, "name"));
    const sorted = [...hands[s]].sort((a, b) => sortKey(a, rec.level) - sortKey(b, rec.level));
    const row = document.createElement("div");
    row.className = "cards mini";
    for (const c of sorted) row.append(cardEl(cardLabel(c), c % 54 === 13 + rec.level));
    el.append(row);
    if (trick[s]) {
      el.append(text("div", trick[s][2] === 0 ? "不出" : "出牌：", "meta"));
      if (trick[s][1].length) el.append(cardsRow(trick[s][1].map(cardLabel), "cards mini", RANKS[rec.level]));
    }
  }
  const c = $("rcenter");
  c.replaceChildren(text("div", `打 ${rankName(RANKS[rec.level])} · 级数 南北 ${rankName(RANKS[rec.team_levels[0]])} / 东西 ${rankName(RANKS[rec.team_levels[1]])}`, "banner"));
  for (const t of rec.tributes) c.append(text("div", `${rec.names[t.payer]} 进贡 ${t.card} 给 ${rec.names[t.receiver]}` + (t.returned ? `，还贡 ${t.returned}` : ""), "meta"));
  if (k < rec.moves.length) c.append(text("div", "下一手：" + moveText(rec.moves[k])));
  else c.append(text("div", `结果：${teamName(rec.result.win_team)}升 ${rec.result.up} 级`, "banner"));
  if (decision) {
    c.append(text("div", `${rec.names[reviewSeat]} ${playedText(decision.played)}（AI 概率 ${Math.round(decision.p_played * 100)}%）`));
    if (!decision.agrees) c.append(text("div", `AI 更倾向 ${decision.best}（${Math.round(decision.p_best * 100)}%）` +
      (decision.impact !== undefined ? ` · 估计影响 ${decision.impact > 0 ? "+" : ""}${decision.impact} ± ${decision.impact_se} 级` : "")));
  }
  $("rSlider").value = k;
  $("rStep").textContent = `第 ${k} / ${rec.moves.length} 手`;
  const flagged = new Set(review ? review.flagged : []);
  $("moves").replaceChildren(...rec.moves.map((m, i) => {
    const d = text("div", `${String(i + 1).padStart(3)}. ${moveText(m)}`);
    if (i === k) d.classList.add("cur");
    if (flagged.has(i)) d.classList.add("flag");
    d.onclick = () => { rstep = i; renderReplay(); };
    return d;
  }));
}

function reviewPicker(box) {
  const row = document.createElement("div");
  row.className = "controls";
  const sel = document.createElement("select");
  (rec.humans.length ? rec.humans : [0, 1, 2, 3]).forEach(s => sel.append(option(s, `${rec.names[s]}（${NAMES[s]}家）`)));
  sel.value = reviewSeat;
  sel.onchange = () => { reviewSeat = +sel.value; review = null; renderReplay(); loadReview(false); };
  const b = text("button", "用 AI 复盘");
  b.onclick = () => loadReview(true);
  row.append("玩家：", sel, b);
  box.append(row);
}

async function loadReview(start) {
  const box = $("review");
  const deal = route.deal, seat = reviewSeat;
  try {
    const r = start ? await api(`api/deal/${deal}/review`, { seat }) : await api(`api/deal/${deal}/review?seat=${seat}`);
    if (route.deal !== deal || reviewSeat !== seat) return;
    box.replaceChildren();
    reviewPicker(box);
    if (r.status === "done") { review = r.review; renderReview(); renderReplay(); return; }
    if (r.status === "running") {
      box.append(text("div", `正在复盘 ${rec.names[seat]} 的打法…（几秒到一分钟）`));
      setTimeout(() => route.view === "replay" && loadReview(false), 2000);
    } else if (r.status.startsWith("error")) box.append(text("div", "复盘失败：" + r.status.slice(6), "error"));
  } catch (e) { box.replaceChildren(text("div", e.message, "error")); }
}

function renderReview() {
  const box = $("review"), r = review;
  box.append(text("div", `与 AI 一致率：${r.agreement === null ? "—" : Math.round(r.agreement * 100) + "%"}（共 ${r.decisions.length} 次决策）· 本局结果 ${r.result > 0 ? "+" : ""}${r.result} 级`, "name"));
  box.append(text("div", "影响估计是用真实的四家手牌把剩下的牌打完得出的，属于“事后诸葛亮”式的判断，仅供参考。", "meta"));
  if (!r.flagged.length) box.append(text("div", "没有被标记的出牌——打得不错！"));
  for (const step of r.flagged) {
    const d = r.decisions.find(x => x.step === step);
    const item = document.createElement("div");
    item.className = "item";
    item.append(text("div", `第 ${step + 1} 手：${playedText(d.played)}（${Math.round(d.p_played * 100)}%），AI 更倾向 ${d.best}（${Math.round(d.p_best * 100)}%）`));
    if (d.impact !== undefined) item.append(text("div", `估计影响：${d.impact > 0 ? "+" : ""}${d.impact} ± ${d.impact_se} 级（负数表示你的出法更差）`, "meta"));
    item.onclick = () => { rstep = step; renderReplay(); };
    box.append(item);
  }
}

$("rSlider").oninput = () => { rstep = +$("rSlider").value; renderReplay(); };
$("rFirst").onclick = () => { rstep = 0; renderReplay(); };
$("rPrev").onclick = () => { rstep = Math.max(0, rstep - 1); renderReplay(); };
$("rNext").onclick = () => { rstep = Math.min(rec.moves.length, rstep + 1); renderReplay(); };
$("rLast").onclick = () => { rstep = rec.moves.length; renderReplay(); };

function boot() {
  const h = location.hash;
  const r = h.match(/^#replay-(\d+)$/), w = h.match(/^#watch-(\d+)-([0-3])$/), t = h.match(/^#table-(\d+)$/);
  if (r) openReplay(+r[1]);
  else if (w) openTable(+w[1], +w[2]);
  else if (t) openTable(+t[1], 0);   // your own seat (the token in this tab decides which)
  else openLobby();
}
window.onhashchange = boot;
api("api/lobby").then(d => { lobbyData = d; }).finally(boot);
</script>
</body>
